[package]
name = "szz-desktop"
version = "0.1.0"
edition = "2021"
description = "SZZ desktop application"

[dependencies]
tauri = { version = "2.0", features = [] }
szz-core = { path = "../crates/szz-core" }
serde = { version = "1.0", features = ["derive"] }
