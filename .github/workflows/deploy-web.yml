name: Deploy Web (Cloudflare Pages)

on:
  push:
    branches:
      - main
      - milestone/w1
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Quality Gates & Multi-Target Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies for Tauri/GTK on Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Cargo Check & Clippy
        run: |
          cargo check --workspace
          cargo clippy --workspace -- -D warnings

      - name: Cargo Test Workspace
        run: |
          cargo test --workspace

      - name: Dry-Run Launcher Verification
        run: |
          cargo run -p szz-cli -- run fixtures/sample-manifest.json --dry-run

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Frontend & Functions Test Suite
        run: pnpm test

      - name: Build Desktop Bundle
        run: pnpm run build:desktop

      - name: Build Web Bundle (Cloudflare Pages SPA)
        run: pnpm run build:web

      - name: Verify Web Bundle Output Integrity
        run: |
          test -f dist-web/index.html || (echo "dist-web/index.html is missing" && exit 1)
          test -f dist-web/_redirects || (echo "dist-web/_redirects is missing" && exit 1)

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-web
          path: dist-web
          retention-days: 7

  deploy-cloudflare-pages:
    name: Deploy to Cloudflare Pages
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/milestone/w1')
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository (for functions/ edge worker)
        uses: actions/checkout@v4

      - name: Download Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-web
          path: dist-web

      - name: Deploy to Cloudflare Pages (Production)
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist-web --project-name=szz-web --branch=${{ github.ref_name }}

      - name: Note Missing Cloudflare Secrets
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "::notice ::Cloudflare deployment skipped because CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID secrets are not configured in repository."
